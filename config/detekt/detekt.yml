# Overrides on top of detekt's default configuration (buildUponDefaultConfig).
# Compose conventions: PascalCase @Composable functions, many parameters with
# defaults, and long screen functions.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

# Protocol modules (:core:crypto, :core:attestation, :core:keystore) port the
# Go reference byte layout by byte layout: offsets, sizes and lengths are the
# spec's numbers (named in the spec, not in Kotlin), strict parsers reject
# input with one throw per rule, and wire records carry the spec's member
# lists. The rules below that fight that style are excluded there only.
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
    excludes: ['**/core/crypto/**', '**/core/attestation/**']
  ComplexCondition:
    excludes: ['**/core/crypto/**', '**/core/attestation/**', '**/core/keystore/**']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    ignorePrivate: true

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/theme/**', '**/core/crypto/**', '**/core/attestation/**', '**/core/keystore/**']
  ThrowsCount:
    excludes: ['**/core/crypto/**', '**/core/attestation/**', '**/core/keystore/**']
  ReturnCount:
    excludes: ['**/core/crypto/**', '**/core/attestation/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true
  ForbiddenComment:
    active: false

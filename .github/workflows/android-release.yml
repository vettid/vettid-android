name: Android Release

# Builds the SIGNED production release APK and (on a version tag) publishes
# a GitHub Release with the APK + SHA-256 checksums.
#
# Triggers:
#   • push a tag like v1.0.50  -> builds AND publishes a Release for that tag
#   • manual "Run workflow"    -> builds + uploads the APK as a run artifact
#                                 (no Release is created), for test/debug runs
#
# Signing secrets (repo Settings -> Secrets and variables -> Actions):
#   VETTID_KEYSTORE_BASE64    base64 of the release keystore (see docs/RELEASE-CI.md)
#   VETTID_KEYSTORE_PASSWORD  keystore password
#   VETTID_KEY_ALIAS          signing key alias
#   VETTID_KEY_PASSWORD       key password
#   VETTID_SIGNING_CERT_SHA256 (optional) cert SHA-256 hex for the runtime pin (#49)
#
# The app/build.gradle.kts signingConfig already reads these via env vars
# (VETTID_KEYSTORE_PATH / _PASSWORD / VETTID_KEY_ALIAS / _PASSWORD).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          VETTID_KEYSTORE_BASE64: ${{ secrets.VETTID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VETTID_KEYSTORE_BASE64" ]; then
            echo "::error::VETTID_KEYSTORE_BASE64 secret is not set — cannot produce a signed release."
            exit 1
          fi
          echo "$VETTID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.keystore") bytes)"

      - name: Assemble signed production release
        env:
          VETTID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          VETTID_KEYSTORE_PASSWORD: ${{ secrets.VETTID_KEYSTORE_PASSWORD }}
          VETTID_KEY_ALIAS: ${{ secrets.VETTID_KEY_ALIAS }}
          VETTID_KEY_PASSWORD: ${{ secrets.VETTID_KEY_PASSWORD }}
          VETTID_SIGNING_CERT_SHA256: ${{ secrets.VETTID_SIGNING_CERT_SHA256 }}
        run: ./gradlew assembleProductionRelease --stacktrace

      - name: Package APK + checksums
        id: package
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SRC=app/build/outputs/apk/production/release/vettid-app-production-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected release APK not found at $SRC"; ls -R app/build/outputs/apk || true; exit 1
          fi
          OUT="vettid-app-v${VERSION}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$OUT"
          ( cd dist && sha256sum "$OUT" > android-checksums.txt )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=dist/$OUT" >> "$GITHUB_OUTPUT"
          echo "Built $OUT"
          cat dist/android-checksums.txt

      - name: Verify the APK is NOT debug-signed
        run: |
          set -euo pipefail
          # Guard: a debug-signed APK means the release signingConfig silently
          # fell back to debug (missing/incorrect secrets). Fail loudly.
          KT=$(find "$JAVA_HOME" -name keytool | head -1)
          SIGNER=$("$KT" -printcert -jarfile "${{ steps.package.outputs.apk }}" 2>/dev/null | grep -i "Owner:" | head -1 || true)
          echo "Signer: $SIGNER"
          if echo "$SIGNER" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed — release signing secrets are missing or wrong."
            exit 1
          fi

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: vettid-app-v${{ steps.package.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.package.outputs.apk }}" dist/android-checksums.txt \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes

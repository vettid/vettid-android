# gitleaks configuration for vettid-android. Extends the default ruleset.
#
# The only allowlisted values are the fixed, test-only VAULT-MESSAGING §16
# vector values that the vettid-vault repository allowlists too (its
# .gitleaks.toml): HPKE intermediate values derived from the public
# all-0x05 key seed and all-0x07 encapsulation randomness, the PUBLIC keys
# (SPKI) of the §16 release-update test keys (scalars 32 x 0x21 and
# 32 x 0x22), and the dummy ULIDs built from the §5.3 example ULID
# (01JB2Z6V9K3M4N5P6Q7R8S9T..), which the generic rule mistakes for keys.
# They live in core/crypto/src/test/resources/vectors (copied from
# vettid-vault) and in the tests. Reviewed findings in the v1 history are in
# .gitleaksignore.
[extend]
useDefault = true

[[allowlists]]
description = "VAULT-MESSAGING §16 test vectors (test-only, public)"
regexTarget = "match"
regexes = [
  '''3239a1c6d8d76895e408c7e65ee38d8b43f4732c7a74c5ccfbac6bd63f743bce''',
  '''f8cfa15ec73bf1031bc50dfc462438a3d6a3d933f7edf6b28bc149fd7400e2a6''',
  '''1d7856a1a77eee3accf4e69fb2353f2421e3f15584739e5c6df73d487b4b66b4''',
  '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAERi26GuT8GpaLTazyDN1tvh''',
  '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE1lqTl3yqPRsIGFL/V6eeRl8W''',
  '''01JB2Z6V9K3M4N5P6Q7R8S9T[0-9A-Z]{2}''',
  # The SHA-256 of VettID's Android signing CERTIFICATE (public; pinned by production vault releases), in
  # the draft F-Droid recipe's AllowedAPKSigningKeys (docs/fdroid/com.vettid.app.yml).
  '''31a19613aa10f209e08945f947f94f7ce3e6e5ac342457ff9969a67986928e65''',
  # Release R (VAULT-MESSAGING 0.33.0 §11.14) test vectors, allowlisted in vettid-vault's .gitleaks.toml too: unlock.json's
  # derived unlock keys and secret checks, recovery.json's browser key (public) and secrets hash, and two passwords of
  # the shared verdict file (testdata/passwords/verdicts.json). All are fixed, public and TEST ONLY.
  '''f01975109b4575d994ade44aeae5d667eb56f14b610d1004694a707e9702e624''',
  '''89f9fa1389f2e7ecfd0521ab27b39207d867a8acd3f99cd23ba19b3c357ccfde''',
  '''dd657b8c27f970d60c271e531e9477aeef25da911a5e5041be3fc7b886044802''',
  '''c12589e53da8326b90b0e362e09f83d1ec315e22936c6069decaa686d7a01ef3''',
  '''6286862e0e08397dc6b79b2b39f3e37ea03fd8a21ca6c1d09bf33fe9d89e5452''',
  '''042464a2f8813e007299b9c0beef9c8d6d8d17470b32bba0329c145f0cfc60b683f831a3''',
  '''QWERTY123456''',
  '''violet-Kestrel-91-moss''',
  # The wallet data-directory scan tests' made-up credential password (core/wallet and feature/wallet
  # WalletDataDirectoryScanTest): a fixed, TEST ONLY value the scans look for on disk, never a real one.
  '''Vx7-corr3ct-horse-pw''',
  # VAULT-MESSAGING 0.28.0 / docs/calls/CALL-MEDIA.md §8 call-media vectors (from vettid-vault's calls.json, TEST ONLY,
  # printed in the specification): the frame keys of k_dir("caller") for suite 1 and suite 2, named as constants in
  # :core:calls' FrameFormatDeviceTest.
  '''df487affce123283952f691628c1c2de''',
  '''e2637ed9e4ab88d26b3f34869104e58d355e1eb7b6c5b7d3aea521bda4fd83da''',
]

# §10.19 vote vectors (BALLOT-PROTOCOL §11; vettid-vault testdata/vote/vectors.json, itself a byte-for-byte copy of
# vettid/service-vault vote/testdata/vectors.json, copied byte for byte to core/crypto/src/test/resources/vectors/vote.json).
# Every key, signature, seed and record secret in it is derived from fixed, public phrases by the reference implementation,
# so none is a secret; the generic rule takes `record_secret`, `seed`, `key` and `sig` for credentials. Scoped, as in
# vettid-vault's and service-vault's own .gitleaks.toml, to this one file by path, and here also to the generic-api-key rule.
# (Until BALLOT-PROTOCOL 0.13.10 this listed the exact values; the shared vectors now grow with the protocol.)
[[allowlists]]
description = "vote vectors (test-only, public, from fixed inputs)"
targetRules = ["generic-api-key"]
paths = [
  '''^core/crypto/src/test/resources/vectors/vote\.json$''',
]

# The y coordinates of the edwards25519 points of order 8 (public curve constants, not secrets), in Ed25519.kt's table of
# small-order points for BALLOT-PROTOCOL §2's strict verification (the same table as vettid-vault's vms/votewire/verify.go).
# Scoped to the generic-api-key rule, to that one file and to exactly these two values.
[[allowlists]]
description = "edwards25519 order-8 y coordinates (public curve constants)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^core/crypto/src/main/kotlin/com/vettid/core/crypto/Ed25519\.kt$''',
]
regexTarget = "match"
regexes = [
  '''26e8958fc2b227b045c3f489f2ef98f0d5dfac05d3c63339b13802886d53fc05''',
  '''c7176a703d4dd84fba3c0b760d10670f2a2053fa2c39ccc64ec7fd7792ac037a''',
]

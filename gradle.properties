# Gradle memory and parallelism are capped on purpose: this repo is built on a
# shared development machine alongside other heavy jobs. Raise locally in
# ~/.gradle/gradle.properties if you have the headroom.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
